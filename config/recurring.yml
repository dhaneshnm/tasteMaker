#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  # Story 0023: keeps the queue filled 7 days ahead. 05:00 ET is after the
  # Eastern rollover the whole app clocks on (config/application.rb) and
  # before any human's morning — the buffer exists so the curator finds
  # today's day already scheduled, not waiting on a cron job.
  fill_daily_pick_queue:
    class: FillQueueJob
    schedule: every day at 5am America/New_York
  # Story 0010: the daily knock, seven hours after the fill above guarantees
  # today's day exists. Noon per the corpus ("at noon every day I get my
  # DailyArt notification"), not per-device local time — one clock, same as
  # the fill (decisions/0019).
  daily_push:
    class: DailyPushJob
    schedule: every day at 12pm America/New_York
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
