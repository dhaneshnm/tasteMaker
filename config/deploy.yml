# Kamal 2 — one app, one VPS, SQLite on a persistent volume.
#
# ─────────────────────────────────────────────────────────────────────────────
# Every value in this file is now real. The box is a GCP e2-medium in
# us-central1-a — see `decisions/0012-gcp-is-the-box.md`, which supersedes 0009.
#
# Then: `kamal setup` once, `kamal deploy` thereafter.
#
# BEFORE `kamal setup`, both of these must be true or it fails:
#
#   1. dailytondo.com must already RESOLVE to the IP below. Let's Encrypt is
#      issued on first deploy; if DNS is not live the cert fails and the app
#      answers on plain HTTP.
#   2. Both secrets exported. KAMAL_REGISTRY_PASSWORD needs the `write:packages`
#      scope — a plain `gh auth token` does NOT have it by default:
#        gh auth refresh -h github.com -s write:packages
#        export KAMAL_REGISTRY_PASSWORD=$(gh auth token)
#        export RAILS_MASTER_KEY=$(cat config/master.key)
#
# GCP-specific, and the reason the ssh block below stays at Kamal's defaults:
# the instance was created with `enable-oslogin=FALSE` and a `root:` key in
# metadata. Ubuntu ships `PermitRootLogin prohibit-password`, so root logs in by
# key. Rebuilding the box WITHOUT that metadata breaks `ssh.user: root`.
#
# TWO THINGS THE FIRST DEPLOY DOES THAT NOTHING WARNS YOU ABOUT. Both were found
# by running this image locally, not by reading:
#
#   1. First boot downloads the museum images before the app answers. This note
#      said "110 images, ~30s" — that was written before story 0013 and is now
#      wrong by a factor of eighteen. The pool is 2,002 works, 974 MB on disk.
#      Expect minutes, not seconds, and give the health check room. Do not
#      conclude the deploy hung.
#   2. Seeds create paintings but ZERO daily picks, so the front door comes up
#      on its empty state — "The first artwork arrives soon." Schedule day one
#      at /admin/daily_picks before sending anyone the link.
# ─────────────────────────────────────────────────────────────────────────────

service: tondo

# Namespace/repo only. `registry.server` below is prepended, so including
# "ghcr.io/" here produces ghcr.io/ghcr.io/... and the push 404s.
image: dhaneshnm/tondo

# Kamal's default is 30 SECONDS, and that is wrong for this app's first boot.
# `bin/docker-entrypoint` runs `db:prepare` when the server starts, and on a
# fresh database that runs the seeds — which download 2,002 images from four
# museum APIs, sequentially, before the app answers. At 30s the health check
# kills a deploy that is working perfectly and rolls it back.
#
# This cost is one-time. On every later deploy the volume already holds the
# database, so `db:prepare` only migrates and the container answers in seconds.
# The seeds are idempotent and resume rather than restart, so a timeout here is
# survivable — retrying picks up where it stopped.
deploy_timeout: 1800

servers:
  web:
    # GCP e2-medium, project tondo-prod, zone us-central1-a, instance "tondo".
    # This is a RESERVED static address (`tondo-ip`), not an ephemeral one — an
    # ephemeral IP changes on stop/start and would break DNS and the cert.
    - 34.59.147.140

proxy:
  ssl: true
  # Must already resolve to the server above before `kamal setup`.
  host: dailytondo.com
  # Thruster listens on 80 inside the container (Dockerfile EXPOSE 80). It also
  # runs its own 64MB HTTP cache, which is why every public page in this app is
  # deliberately `Cache-Control: public` and carries no Set-Cookie (story 0007).
  app_port: 80

registry:
  server: ghcr.io
  # GitHub username. The token in KAMAL_REGISTRY_PASSWORD must carry
  # `write:packages` or the push 403s.
  username: dhaneshnm
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # One clock for the whole product. `DailyPick.current` is only correct if
    # `Date.current` means "today in New York" — the day has to roll over at the
    # same instant for every reader, wherever they are.
    TZ: America/New_York
    # Story 0021: the daily queue-fill job runs inside this Puma process.
    # config/puma.rb compares this against the literal string "true" — never
    # remove the quotes below to "simplify" this into a YAML boolean, or the
    # comparison silently goes false and the job never runs.
    SOLID_QUEUE_IN_PUMA: "true"

# SQLite and Active Storage both write to /rails/storage. Kamal replaces the
# container on every deploy, so without this volume each deploy would ship an
# empty database and throw away the curator's queue and every reader's
# collection. This is the one line in the file that loses data if it is wrong.
volumes:
  - "tondo_storage:/rails/storage"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# The image is built here and pushed, so the builder needs to match the server's
# architecture. Most VPS hosts are amd64; this Mac is arm64.
builder:
  arch: amd64

asset_path: /rails/public/assets

# Not configured, deliberately:
#
# - accessories (Postgres/Redis): SQLite + Solid gems are the stack (CLAUDE.md).
# - a second server: BET.md's floor is 50 installs. One VPS is the right size,
#   and SQLite on a local disk cannot be load-balanced anyway.
