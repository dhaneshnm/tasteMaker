# An inline 800x1000 PNG stands in for the museum CDN: real geometry for system
# tests, no network for anyone.
#
# It used to be a 1x1 pixel, which laid out at 1x1 because `.plate__img` is
# `width: auto; height: auto` — the width/height attributes only set an aspect
# ratio, they do not override the intrinsic size. Every fold-budget assertion in
# the suite was therefore measuring a layout with no artwork in it. See
# test/system/dynamic_type_test.rb.
#
# `artist_slug:` is set explicitly below, per fixture, rather than left to
# `Painting`'s `before_save` callback (story 0018) — fixtures load by direct
# INSERT, bypassing every model callback and validation, so a row here whose
# slug the callback would compute gets NULL instead unless this file says so.
# Each value is `Painting.artist_slug_for(artist)`, verified by hand against
# the model at fixture-writing time.
DEFAULTS: &DEFAULTS
  image_url_800: "data:image/png;base64,"
  image_width: 800
  image_height: 1000
  department: Paintings
  source: mia

sunflowers:
  <<: *DEFAULTS
  source_id: 900001
  title: Sunflowers in a Blue Vase
  artist: Vincent van Gogh
  artist_slug: vincent-van-gogh
  life_date: 1853–1890
  dated: "1888"
  medium: Oil on canvas
  creditline: The William Hood Dunwoody Fund
  accession_number: 62.36
  # Museum copy, the fallback when a day has no hand-written note.
  description: The museum's own catalogue text, written by a curator who is not ours.

harbour:
  <<: *DEFAULTS
  source_id: 900002
  title: Harbour at Dawn
  artist: Berthe Morisot
  artist_slug: berthe-morisot
  life_date: 1841–1895
  dated: "1875"
  medium: Oil on canvas

bronze:
  <<: *DEFAULTS
  source_id: 900003
  title: Bronze Ritual Vessel
  culture: Chinese
  dated: 11th century BCE
  medium: Bronze

woodcut:
  <<: *DEFAULTS
  source_id: 900004
  title: Rain at Shono
  artist: Utagawa Hiroshige
  artist_slug: utagawa-hiroshige
  dated: "1833"
  medium: Woodblock print
  description: Museum copy for the day nobody wrote a note.

# Deliberately has no image at all: nothing to attach, nothing to hotlink.
# `artist: Unknown` is deny-listed (NOT_AN_ARTIST, found by /qa 2026-08-19 —
# a museum placeholder, not a name), so `artist_slug` is nil, not "unknown".
imageless:
  source: mia
  source_id: 900005
  title: Lost Panel
  artist: Unknown
  department: Paintings

# A LANDSCAPE work, and the pixels are really landscape. Setting `image_width`
# and `image_height` on a fixture that inherits DEFAULTS would not do it: the
# comment at the top of this file records why — those attributes only set an
# aspect ratio and never override the intrinsic size, which is how the suite
# once measured a layout with no artwork in it at all. A test that needs a
# landscape work needs landscape bytes.
#
# 1000x800, one flat colour, 193 bytes. Story 0014 uses it to prove the action
# rail costs a wide painting nothing on either phone: a landscape plate is
# width-constrained long before any height cap can reach it.
#
# `feed_order` is set high on purpose. Fixture ids are hashed rather than
# sequential, so a new painting with a nil `feed_order` can sort to the TOP of
# `/feed` and push an existing work below the scroll-in reveal — where Selenium
# stops calling it visible and two gallery tests that never mentioned this
# fixture start failing. Sorting last keeps a fixture added for the daily page
# out of the gallery's way.
wide_harbour:
  <<: *DEFAULTS
  feed_order: 9000
  source_id: 900009
  title: A Wide Harbour
  artist: Berthe Morisot
  artist_slug: berthe-morisot
  life_date: 1841–1895
  dated: "1875"
  medium: Oil on canvas
  image_url_800: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA+gAAAMgAQAAAACYY3WQAAAAA1BMVEWKel4S204DAAAAeUlEQVR42u3BAQ0AAADCoPdPbQ43oAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADgzwCJzwABXJCwkwAAAABJRU5ErkJggg=="
  image_width: 1000
  image_height: 800

# Story 0018. Four fixtures below, all with `feed_order:` set high — see the
# `wide_harbour` comment above: a new painting with a nil `feed_order` can
# sort ahead of an existing one (fixture ids are hashed, not sequential) and
# push it below the fold, where Selenium stops calling it visible and
# unrelated feed system tests start failing. None of these four need to be
# near the top.

