# An inline 800x1000 PNG stands in for the museum CDN: real geometry for system
# tests, no network for anyone.
#
# It used to be a 1x1 pixel, which laid out at 1x1 because `.plate__img` is
# `width: auto; height: auto` — the width/height attributes only set an aspect
# ratio, they do not override the intrinsic size. Every fold-budget assertion in
# the suite was therefore measuring a layout with no artwork in it. See
# test/system/dynamic_type_test.rb.
DEFAULTS: &DEFAULTS
  image_url_800: "data:image/png;base64,"
  image_width: 800
  image_height: 1000
  department: Paintings

sunflowers:
  <<: *DEFAULTS
  mia_id: 900001
  title: Sunflowers in a Blue Vase
  artist: Vincent van Gogh
  life_date: 1853–1890
  dated: "1888"
  medium: Oil on canvas
  creditline: The William Hood Dunwoody Fund
  accession_number: 62.36
  # Museum copy, the fallback when a day has no hand-written note.
  description: The museum's own catalogue text, written by a curator who is not ours.

